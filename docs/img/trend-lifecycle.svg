<text x="70" y="443" font-size="13.5" fill="#D1D4DC"><tspan font-weight="700">Разворот вверх. </tspan><tspan fill="#9598A1">Закрытие над фиолетовой линией — она уходит под цену и становится голубой. BUY — если подтвердили фильтры.</tspan></text>
<circle cx="51.0" cy="467.0" r="11" fill="#D1D4DC"/><text x="51.0" y="471.5" text-anchor="middle" font-size="13" font-weight="700" fill="#131722">2</text>
<text x="70" y="472" font-size="13.5" fill="#D1D4DC"><tspan font-weight="700">Ретест зоны. </tspan><tspan fill="#9598A1">Откат в зону и закрытие над ней — треугольник. Стоп под зоной, тейк 2R. Главный источник прибыли в бэктесте.</tspan></text>
<circle cx="51.0" cy="496.0" r="11" fill="#D1D4DC"/><text x="51.0" y="500.5" text-anchor="middle" font-size="13" font-weight="700" fill="#131722">3</text>
<text x="70" y="501" font-size="13.5" fill="#D1D4DC"><tspan font-weight="700">Стоп. </tspan><tspan fill="#9598A1">Тень прошла сквозь зону и выбила стоп, но свеча закрылась над линией — тренд не сломан.</tspan></text>
<circle cx="51.0" cy="525.0" r="11" fill="#D1D4DC"/><text x="51.0" y="529.5" text-anchor="middle" font-size="13" font-weight="700" fill="#131722">4</text>
<text x="70" y="530" font-size="13.5" fill="#D1D4DC"><tspan font-weight="700">Ре-вход. </tspan><tspan fill="#9598A1">После стопа цена обновила максимум 5 баров при живом тренде — ромб, стоп под базой пробоя.</tspan></text>
<circle cx="51.0" cy="554.0" r="11" fill="#D1D4DC"/><text x="51.0" y="558.5" text-anchor="middle" font-size="13" font-weight="700" fill="#131722">5</text>
<text x="70" y="559" font-size="13.5" fill="#D1D4DC"><tspan font-weight="700">Разворот вниз. </tspan><tspan fill="#9598A1">Закрытие под голубой линией: тренд сменился, сделка закрыта по FLIP, дальше ждём SELL.</tspan></text>
